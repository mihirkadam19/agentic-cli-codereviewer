name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"   # triggers on tags like v0.1.3
  workflow_dispatch:  # also allows manual runs from the Actions tab

permissions:
  contents: write   # needed to create releases and upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: codechk-linux
          - os: macos-latest
            asset_name: codechk-macos
          - os: windows-latest
            asset_name: codechk-windows.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build binary
        run: >
          pyinstaller --onefile --name codechk
          --hidden-import typer
          --hidden-import click
          --hidden-import anthropic
          --hidden-import langgraph
          --collect-all langgraph
          --collect-all anthropic
          app/cli.py

      - name: Rename binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: mv dist/codechk dist/${{ matrix.asset_name }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        run: mv dist/codechk.exe dist/${{ matrix.asset_name }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}